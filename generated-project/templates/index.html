<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-10">
    <div class="max-w-4xl mx-auto px-4">
        <h1 class="text-3xl font-bold text-center text-indigo-600 mb-8">Study Planner</h1>
        
        <div class="bg-white rounded-lg shadow p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Add New Study Task</h2>
            <form action="/add" method="POST" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" name="title" placeholder="Task / Topic" required class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <input type="text" name="subject" placeholder="Subject" required class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <input type="date" name="deadline" required class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button type="submit" class="bg-indigo-600 text-white rounded px-4 py-2 hover:bg-indigo-700 transition">Add Task</button>
            </form>
        </div>

        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Subject</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Task</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Deadline</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    {% for task in tasks %}
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <form action="/toggle/{{ task['id'] }}" method="POST">
                                <button type="submit" class="text-sm px-2 py-1 rounded {{ 'bg-green-100 text-green-800' if task['completed'] else 'bg-yellow-100 text-yellow-800' }}">
                                    {{ 'Completed' if task['completed'] else 'Pending' }}
                                </button>
                            </form>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ task['subject'] }}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 {{ 'line-through text-gray-400' if task['completed'] else '' }}">{{ task['title'] }}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ task['deadline'] }}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <form action="/delete/{{ task['id'] }}" method="POST" class="inline">
                                <button type="submit" class="text-red-600 hover:text-red-900">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="5" class="px-6 py-4 text-center text-sm text-gray-500">No study tasks planned yet. Add one above!</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
